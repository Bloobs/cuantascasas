<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>Número de viviendas en alquiler</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --ink: #14233a;
      --muted: #6c7b91;
      --line: #dce5f0;
      --accent: #356ae6;
      --up: #11875d;
      --down: #d45151;
      --flat: #718096;
      --map: #dbe7f8;
      --map-hover: #bad0f6;
      --shadow: 0 18px 55px rgba(36, 62, 98, .10);
    }
    body[data-theme="dark"] {
      --bg: #0e1725;
      --panel: #172438;
      --ink: #edf4ff;
      --muted: #9eafc6;
      --line: #2d405a;
      --accent: #78a2ff;
      --map: #274363;
      --map-hover: #385d87;
      --shadow: 0 18px 55px rgba(0, 0, 0, .28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .shell { width: min(1440px, 100%); margin: 0 auto; padding: 28px; }
    .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin: 4px 0 24px 2px; }
    h1 { margin: 0; font-size: clamp(1.65rem, 3vw, 2.55rem); letter-spacing: -.045em; }
    .subtitle { color: var(--muted); margin: 7px 0 0; font-size: .94rem; }
    .theme-toggle { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--panel); color: var(--ink); font: inherit; font-size: .78rem; cursor: pointer; }
    .theme-toggle:hover, .theme-toggle:focus-visible { border-color: var(--accent); outline: none; }
    .layout { min-height: calc(100vh - 150px); }
    .panel, .map-card { background: var(--panel); border: 1px solid rgba(220,229,240,.9); border-radius: 24px; box-shadow: var(--shadow); }
    .panel { width: 100%; padding: 12px 22px; display: grid; grid-template-columns: minmax(0, .9fr) minmax(280px, 1.1fr); gap: 28px; align-items: center; }
    .summary-block { min-width: 0; }
    .controls-block { min-width: 330px; }
    .eyebrow { color: var(--muted); font-size: .72rem; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
    .total-row { display: flex; align-items: center; gap: 12px; margin: 4px 0 2px; }
    .total { margin: 0; font-size: clamp(2rem, 4vw, 2.85rem); line-height: 1; letter-spacing: -.065em; font-variant-numeric: tabular-nums; }
    .portal-totals { display: grid; grid-template-columns: 1fr; gap: 3px; min-width: 118px; }
    .portal-total { display: flex; justify-content: space-between; gap: 5px; color: var(--muted); font-size: .64rem; line-height: 1.25; white-space: nowrap; }
    .portal-total strong { color: var(--ink); font-size: .68rem; font-variant-numeric: tabular-nums; }
    .delta { color: var(--flat); font-size: .92rem; font-weight: 650; }
    .up { color: var(--up) !important; } .down { color: var(--down) !important; }
    .rule { height: 1px; background: var(--line); margin: 8px 0; }
    .comparison-title { font-size: .88rem; font-weight: 750; margin: 0 0 6px; }
    .choices { display: grid; grid-template-columns: minmax(0, 260px); gap: 4px; }
    .choice {
      display: flex; align-items: center; gap: 7px; padding: 5px 8px; font-size: .76rem;
      border: 1px solid var(--line); border-radius: 12px; cursor: pointer; color: #33445e;
      transition: border-color .15s, background .15s;
    }
    .choice:has(input:checked) { border-color: #aec4f2; background: #f1f5ff; color: var(--accent); }
    .choice input { width: 13px; height: 13px; margin: 0; accent-color: var(--accent); }
    .map-card { position: relative; min-width: 0; min-height: calc(100vh - 150px); padding: 0 clamp(12px, 2vw, 26px) 26px; overflow: hidden; border: 0; box-shadow: none; background: transparent; }
    .map-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 4px 10px; }
    .map-title { font-size: .9rem; font-weight: 750; }
    .map-controls { display: flex; gap: 5px; }
    .map-controls button { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); color: var(--ink); font-size: 1.15rem; line-height: 1; cursor: pointer; box-shadow: 0 3px 12px rgba(36, 62, 98, .08); }
    .map-controls button:hover, .map-controls button:focus-visible { border-color: #aec4f2; color: var(--accent); outline: none; }
    .legend { display: flex; gap: 12px; color: var(--muted); font-size: .72rem; }
    .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background: currentColor; }
    .legend .positive { color: var(--up); } .legend .negative { color: var(--down); }
    .map-viewport { width: 100%; height: calc(100vh - 245px); min-height: 500px; overflow: auto; border-radius: 14px; }
    svg { display: block; width: 100%; height: 100%; min-width: 100%; min-height: 100%; }
    .province { fill: var(--map); stroke: #fff; stroke-width: .65; vector-effect: non-scaling-stroke; cursor: pointer; transition: fill .15s, filter .15s; }
    .province:hover, .province:focus { fill: var(--map-hover); filter: drop-shadow(0 2px 2px rgba(42,72,120,.25)); outline: none; }
    .province-label { pointer-events: none; text-anchor: middle; fill: #284263; font-size: 12px; font-weight: 750; }
    .province-value { pointer-events: none; text-anchor: middle; fill: var(--ink); font-size: 14px; font-weight: 800; }
    body[data-theme="dark"] .province-label { fill: #d9e7ff; }
    .province-label.up, .province-value.up { fill: var(--up); }
    .province-label.down, .province-value.down { fill: var(--down); }
    .canary-box { fill: #f7f9fc; stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; pointer-events: none; }
    .canary-title { fill: var(--muted); font-size: 7px; font-weight: 800; letter-spacing: .08em; pointer-events: none; }
    .tooltip {
      position: fixed; z-index: 4; display: none; width: min(240px, calc(100vw - 28px)); padding: 14px;
      border: 1px solid rgba(220,229,240,.9); border-radius: 14px; background: rgba(255,255,255,.97);
      box-shadow: 0 14px 40px rgba(24,45,77,.2); pointer-events: none;
    }
    body[data-theme="dark"] .tooltip {
      border-color: var(--line);
      background: rgba(23, 36, 56, .98);
      box-shadow: 0 14px 40px rgba(0, 0, 0, .42);
      color: var(--ink);
    }
    body[data-theme="dark"] .tooltip h3,
    body[data-theme="dark"] .tooltip .tip-row strong { color: var(--ink); }
    body[data-theme="dark"] .tooltip .tip-row { color: var(--muted); }
    .tooltip.visible { display: block; }
    .tooltip h3 { margin: 0 0 9px; font-size: .88rem; }
    .tip-row { display: flex; justify-content: space-between; gap: 18px; font-size: .78rem; color: var(--muted); padding: 3px 0; }
    .tip-row strong { color: var(--ink); font-variant-numeric: tabular-nums; }
    .tip-main { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 5px; }
    .tip-main strong { font-size: 1.22rem; }
    .status { padding: 24px; text-align: center; color: var(--muted); }
    @media (max-width: 760px) {
      .shell { padding: 17px 12px 28px; }
      .header { margin: 3px 4px 17px; }
      .theme-toggle { padding: 7px 9px; }
      .layout { display: flex; flex-direction: column; gap: 14px; }
      .panel, .map-card { width: 100%; border-radius: 19px; }
      .panel { grid-template-columns: 1fr; gap: 8px; padding: 12px 18px; order: 0; }
      .controls-block { min-width: 0; }
      .panel .rule { margin: 8px 0; }
      .choices { grid-template-columns: minmax(0, 260px); gap: 5px; }
      .choice { padding: 5px 3px; justify-content: center; font-size: .68rem; }
      .map-card { min-height: 0; order: 1; }
      .map-viewport { height: 58vh; min-height: 270px; }
      svg { height: 100%; min-height: 100%; }
      .map-top { align-items: flex-start; flex-direction: column; gap: 6px; }
    }
    @media (max-width: 420px) {
      .choices { grid-template-columns: minmax(0, 260px); gap: 5px; }
      .choice { justify-content: center; padding: 5px 3px; font-size: .64rem; }
    }
  </style>
</head>

      <div>
        <h1>Número de viviendas en alquiler</h1>
        <p class="subtitle">Datos disponibles: <strong id="date-range">—</strong></p>

  <div id="tooltip" class="tooltip" role="status"></div>
  <script>
    const map = document.querySelector("#map");
    const tooltip = document.querySelector("#tooltip");
    const periodLabels = { day: "día anterior", week: "semana anterior", month: "mes anterior" };
    const portalLabels = { idealista: "Idealista", fotocasa: "Fotocasa", pisos: "Pisos.com", habitaclia: "Habitaclia", oferta_estimada: "Oferta estimada" };
    const periodDays = { day: 1, week: 7, month: 30 };
    let dataset = {};
    let latestDate = "";
    let selectedPeriod = "day";
    let zoom = 1;
    const themeToggle = document.querySelector("#theme-toggle");

    function applyTheme(theme) {
      document.body.dataset.theme = theme;
      const dark = theme === "dark";
      themeToggle.textContent = dark ? "Modo claro" : "Modo oscuro";
      themeToggle.setAttribute("aria-label", dark ? "Cambiar a modo claro" : "Cambiar a modo oscuro");
    }

    applyTheme(localStorage.getItem("dashboard-theme") || "light");
    themeToggle.addEventListener("click", () => {
      const nextTheme = document.body.dataset.theme === "dark" ? "light" : "dark";
      applyTheme(nextTheme);
      localStorage.setItem("dashboard-theme", nextTheme);
    });

    const format = value => new Intl.NumberFormat("es-ES").format(value);
    const dateText = value => new Intl.DateTimeFormat("es-ES", { day: "numeric", month: "long", year: "numeric" }).format(new Date(`${value}T12:00:00`));
    const daysBetween = (a, b) => Math.round((new Date(`${a}T12:00:00`) - new Date(`${b}T12:00:00`)) / 86400000);
    const provinceData = (record, name) => record?.[name] || record?.[name === "Álava" ? "Araba/Álava" : name];
    function previousRecord(days) {
      const dates = Object.keys(dataset).sort();
      const target = new Date(`${latestDate}T12:00:00`);
      target.setDate(target.getDate() - days);
      const candidates = dates.filter(date => new Date(`${date}T12:00:00`) <= target);
      return candidates.length ? dataset[candidates[candidates.length - 1]] : null;
    }
    function winner(values) {
      const portals = Object.keys(values || {}).filter(key => key !== "oferta_estimada");
      return portals.reduce((best, key) => values[key] > values[best] ? key : best, portals[0]);
    }
    function totalFor(record) {
      return Object.values(record || {}).reduce((sum, values) => sum + (values ? Number(values[winner(values)]) || 0 : 0), 0);
    }
    function portalTotals(record) {
      return Object.values(record || {}).reduce((totals, values) => {
        Object.entries(values || {}).forEach(([portal, value]) => { totals[portal] = (totals[portal] || 0) + (Number(value) || 0); });
        return totals;
      }, {});
    }
    function deltaClass(delta) { return delta > 0 ? "up" : delta < 0 ? "down" : ""; }
    function showTooltip(name, event) {
      const current = provinceData(dataset[latestDate], name);
      const previous = provinceData(previousRecord(periodDays[selectedPeriod]), name);
      if (!current) return;
      const key = winner(current), value = Number(current[key]) || 0;
      const oldValue = previous ? Number(previous[key]) || 0 : null;
      const delta = oldValue === null ? null : value - oldValue;
      tooltip.innerHTML = `<h3>${name}</h3><div class="tip-main"><strong class="${deltaClass(delta)}">${format(value)}</strong><span class="delta ${deltaClass(delta)}">${delta === null ? "sin histórico" : `${delta > 0 ? "+" : ""}${format(delta)}`}</span></div>` +
        Object.entries(current).map(([portal, count]) => `<div class="tip-row"><span>${portalLabels[portal] || portal}</span><strong>${format(count)}</strong></div>`).join("");
      tooltip.classList.add("visible");
      positionTooltip(event);
    }
    function positionTooltip(event) {
      const pad = 12, rect = tooltip.getBoundingClientRect();
      let x = event.clientX + 14, y = event.clientY + 14;
      if (x + rect.width > innerWidth - pad) x = innerWidth - rect.width - pad;
      if (y + rect.height > innerHeight - pad) y = innerHeight - rect.height - pad;
      tooltip.style.left = `${Math.max(pad, x)}px`; tooltip.style.top = `${Math.max(pad, y)}px`;
    }
    function render() {
      const current = dataset[latestDate], previous = previousRecord(periodDays[selectedPeriod]);
      const total = totalFor(current), oldTotal = previous ? totalFor(previous) : null;
      const totalDelta = oldTotal === null ? null : total - oldTotal;
      document.querySelector("#total").textContent = format(total);
      document.querySelector("#total").className = `total ${deltaClass(totalDelta)}`;
      document.querySelector("#portal-totals").innerHTML = Object.entries(portalTotals(current))
        .map(([portal, value]) => `<div class="portal-total"><span>${portalLabels[portal] || portal}</span><strong>${format(value)}</strong></div>`)
        .join("");
      document.querySelector("#total-delta").className = `delta ${deltaClass(totalDelta)}`;
      document.querySelector("#total-delta").textContent = totalDelta === null ? "Sin datos históricos para comparar" : `${totalDelta > 0 ? "+" : ""}${format(totalDelta)} vs. ${periodLabels[selectedPeriod]}`;
      document.querySelector("#map-period").textContent = `Variación respecto al ${periodLabels[selectedPeriod]}`;
      map.querySelectorAll(".province-label, .province-value").forEach(text => {
        const name = text.dataset.name, values = provinceData(current, name), old = provinceData(previous, name);
        const key = winner(values), value = Number(values[key]) || 0, delta = old ? value - (Number(old[key]) || 0) : null;
        if (text.classList.contains("province-value")) text.textContent = format(value);
        text.classList.remove("up", "down"); if (delta) text.classList.add(deltaClass(delta));
      });
    }
    function applyZoom() {
      map.style.width = `${zoom * 100}%`;
      map.style.height = `${zoom * 100}%`;
    }
    function centerProvinceLabels() {
      const pathsByName = new Map();
      map.querySelectorAll(".province").forEach(path => {
        const name = path.dataset.name;
        if (!pathsByName.has(name)) pathsByName.set(name, []);
        pathsByName.get(name).push(path);
      });
      pathsByName.forEach((paths, name) => {
        const boxes = paths.map(path => path.getBBox()).filter(box => box.width || box.height);
        if (!boxes.length) return;
        const left = Math.min(...boxes.map(box => box.x));
        const top = Math.min(...boxes.map(box => box.y));
        const right = Math.max(...boxes.map(box => box.x + box.width));
        const bottom = Math.max(...boxes.map(box => box.y + box.height));
        const label = map.querySelector(`.province-label[data-name="${CSS.escape(name)}"]`);
        const value = map.querySelector(`.province-value[data-name="${CSS.escape(name)}"]`);
        label?.setAttribute("x", (left + right) / 2);
        label?.setAttribute("y", (top + bottom) / 2 - 7);
        label?.setAttribute("dy", "0");
        value?.setAttribute("x", (left + right) / 2);
        value?.setAttribute("y", (top + bottom) / 2 + 9);
        value?.setAttribute("dy", "0");
      });
    }
    function drawMap() {
      const layer = document.querySelector("#province-layer");
      layer.querySelectorAll(".province-label").forEach(label => {
        label.setAttribute("dy", "-4");
      });
      layer.querySelectorAll(".province-value").forEach(value => {
        value.setAttribute("dy", "5");
      });
      // Las etiquetas se añaden al final para que ningún territorio las tape.
      layer.querySelectorAll("text").forEach(text => layer.appendChild(text));
      centerProvinceLabels();

      const names = Object.keys(dataset[latestDate] || {});
      map.querySelectorAll("[data-name]").forEach(node => {
        const name = node.dataset.name;
        if (!names.includes(name) && !(name === "Álava" && names.includes("Araba/Álava"))) node.style.display = "none";
      });
      map.querySelectorAll(".province").forEach(path => {
        path.addEventListener("mouseenter", e => showTooltip(path.dataset.name, e));
        path.addEventListener("mousemove", positionTooltip);
        path.addEventListener("mouseleave", () => tooltip.classList.remove("visible"));
        path.addEventListener("click", e => showTooltip(path.dataset.name, e));
        path.addEventListener("touchstart", e => { e.preventDefault(); showTooltip(path.dataset.name, e.touches[0]); }, { passive: false });
      });
    }
    async function start() {
      try {
        const response = await fetch("housing_counts.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        dataset = await response.json();
        const dates = Object.keys(dataset).sort();
        if (!dates.length) throw new Error("El JSON no contiene fechas");
        latestDate = dates[dates.length - 1];
        document.querySelector("#date-range").textContent = `Desde ${dateText(dates[0])} hasta ${dateText(latestDate)}`;
        document.querySelector("#map-status").remove();
        drawMap(); render();
      } catch (error) {
        document.querySelector("#map-status").textContent = "No se han podido cargar los datos. Sirve el HTML junto a housing_counts.json.";
        console.error("Error cargando housing_counts.json:", error);
      }
    }
    document.querySelectorAll('input[name="period"]').forEach(input => input.addEventListener("change", () => { selectedPeriod = input.value; render(); }));
    document.querySelector("#zoom-in").addEventListener("click", () => { zoom = Math.min(2, +(zoom + .2).toFixed(1)); applyZoom(); });
    document.querySelector("#zoom-out").addEventListener("click", () => { zoom = Math.max(1, +(zoom - .2).toFixed(1)); applyZoom(); });
    start();
  </script>
